<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ "Sign in" if mode == "login" else "Create account" }} | PillGuard</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>
<body class="auth-page">
  <nav class="navbar app-nav"><div class="container"><a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="/"><span class="brand-mark" aria-hidden="true">+</span><span>PillGuard</span></a><a class="btn btn-ghost" href="/">Back to home</a></div></nav>
  <main class="container auth-container py-5">
    <div id="toast" class="alert d-none" role="status" aria-live="polite"></div>
    <section class="row justify-content-center align-items-center">
      <div class="col-lg-5 col-md-8"><div class="auth-card card border-0 shadow-sm p-4 p-md-5">
        <p class="eyebrow mb-2">YOUR CARE, CONNECTED</p>
        {% if mode == "login" %}
        <h1 class="h2 mb-2">Welcome back</h1><p class="text-secondary mb-4">Sign in to open your secure care dashboard.</p>
        <form id="loginForm">
          <label for="loginEmail" class="form-label">Email address</label><input id="loginEmail" name="email" type="email" autocomplete="email" class="form-control mb-3" required>
          <label for="loginPassword" class="form-label">Password</label><input id="loginPassword" name="password" type="password" autocomplete="current-password" class="form-control mb-4" required>
          <button class="btn btn-primary btn-lg w-100">Sign in</button>
        </form>
        <p class="small text-secondary text-center mt-4 mb-0">New to PillGuard? <a href="{{ url_for('register_page') }}">Create an account</a></p>
        {% else %}
        <h1 class="h2 mb-2">Create your account</h1><p class="text-secondary mb-4">Join your care team on PillGuard.</p>
        <form id="signupForm">
          <label for="registerName" class="form-label">Full name</label><input id="registerName" name="name" autocomplete="name" class="form-control mb-3" required>
          <label for="registerEmail" class="form-label">Email address</label><input id="registerEmail" name="email" type="email" autocomplete="email" class="form-control mb-3" required>
          <label for="registerPassword" class="form-label">Password</label><input id="registerPassword" name="password" type="password" minlength="8" autocomplete="new-password" class="form-control mb-3" required>
          <label for="registerRole" class="form-label">Your role</label><select id="registerRole" name="role" class="form-select mb-4" required><option value="">Choose a role</option><option>Patient</option><option>Caregiver</option>{% if allow_public_doctor_registration %}<option>Doctor</option>{% endif %}</select>
          <button class="btn btn-primary btn-lg w-100">Create account</button>
        </form>
        <p class="small text-secondary text-center mt-4 mb-0">Already registered? <a href="{{ url_for('login_page') }}">Sign in</a></p>
        {% endif %}
      </div></div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
