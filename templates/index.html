<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PillGuard | Medication monitoring</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-white border-bottom">
    <div class="container"><a class="navbar-brand fw-bold text-primary" href="#">PillGuard</a>
      <div class="d-flex align-items-center gap-3"><span id="userLabel" class="text-secondary small"></span><button id="logoutBtn" class="btn btn-outline-secondary btn-sm d-none">Log out</button></div>
    </div>
  </nav>
  <main class="container py-4">
    <div id="toast" class="alert d-none" role="alert"></div>
    <section id="authView" class="row justify-content-center">
      <div class="col-lg-5"><div class="card border-0 shadow-sm p-4">
        <h1 class="h3 mb-1">Medication care, connected.</h1><p class="text-secondary mb-4">Sign in to your role dashboard.</p>
        <form id="loginForm"><label class="form-label">Email</label><input name="email" type="email" class="form-control mb-3" required>
          <label class="form-label">Password</label><input name="password" type="password" class="form-control mb-3" required>
          <button class="btn btn-primary w-100">Sign in</button>
        </form>
        <hr><p class="small text-secondary text-center mb-0">New to PillGuard? <button id="showSignupBtn" type="button" class="btn btn-link btn-sm p-0 align-baseline">Create an account</button></p>
        <form id="signupForm" class="d-none">
          <h2 class="h5 mt-3">Create your account</h2>
          <label class="form-label">Full name</label><input name="name" class="form-control mb-3" required>
          <label class="form-label">Email</label><input name="email" type="email" class="form-control mb-3" required>
          <label class="form-label">Password</label><input name="password" type="password" minlength="8" class="form-control mb-3" required>
          <label class="form-label">Role</label><select name="role" class="form-select mb-3" required><option value="">Choose role</option><option>Doctor</option><option>Patient</option><option>Caregiver</option></select>
          <button class="btn btn-success w-100">Create account</button>
          <button id="showLoginBtn" type="button" class="btn btn-link w-100 mt-2">Back to sign in</button>
        </form>
      </div></div>
    </section>
    <section id="dashboardView" class="d-none">
      <div class="d-flex justify-content-between align-items-end mb-4"><div><p class="eyebrow mb-1">CARE DASHBOARD</p><h1 id="dashboardTitle" class="h2 mb-0"></h1></div><span id="roleBadge" class="badge rounded-pill text-bg-primary"></span></div>
      <div id="doctorView" class="d-none"></div><div id="patientView" class="d-none"></div><div id="caregiverView" class="d-none"></div>
    </section>
  </main>
  <div class="modal fade" id="alarmModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content border-danger">
      <div class="modal-header bg-danger text-white"><h2 class="modal-title h5">Medication reminder</h2></div>
      <div class="modal-body text-center py-4"><div class="alarm-icon mb-3">!</div><p class="h5 mb-1">MEDICATION TIME!</p><p class="mb-0">Please access your Pill Box now.</p><p id="alarmMedication" class="small text-secondary mt-2"></p></div>
      <div class="modal-footer"><button id="acknowledgeAlarmBtn" class="btn btn-danger w-100">Acknowledge Alert</button></div>
    </div></div>
  </div>
  <div class="modal fade" id="caregiverLinkModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h2 class="modal-title h5">Link caregiver</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><form id="caregiverLinkForm"><div class="modal-body"><input type="hidden" name="patient_id"><label class="form-label">Caregiver email</label><input name="email" type="email" class="form-control" required></div><div class="modal-footer"><button class="btn btn-primary">Link caregiver</button></div></form></div></div>
  </div>
  <div class="modal fade" id="consultModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title h5">Tele-consultation</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body p-0"><div id="jitsiFrame" class="consult-frame"></div></div>
    </div></div>
  </div>
  <script src="https://meet.jit.si/external_api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
